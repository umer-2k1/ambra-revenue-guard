  <rect x="828" y="440" width="364" height="26" rx="13" fill="#EEE7DE"/>
  <rect x="828" y="440" width="330" height="26" rx="13" fill="#FE4311"/>
  <text x="828" y="512" font-size="30" font-weight="700" fill="#5C0A05">3 gaps found</text>
  <text x="828" y="552" font-size="30" font-weight="700" fill="#8a7f78">before submission</text>
