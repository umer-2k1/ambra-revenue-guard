<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C0A05"/>
      <stop offset="100%" stop-color="#7A1209"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#g1)"/>
  <polygon points="0,720 520,720 300,470 0,470" fill="#FE4311" opacity="0.16"/>

  <!-- brand chip -->
