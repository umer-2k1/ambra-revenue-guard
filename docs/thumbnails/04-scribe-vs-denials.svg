  <text x="56" y="205" font-size="34" font-weight="700" fill="#c9b7b3">two products that never talked — until now</text>

  <!-- Scribe block -->
  <rect x="70" y="270" width="500" height="230" rx="24" fill="#FFFFFF"/>
  <text x="104" y="332" font-size="46" font-weight="900" fill="#5C0A05">SCRIBE</text>
