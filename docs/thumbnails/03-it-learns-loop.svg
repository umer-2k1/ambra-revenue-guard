<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="180" fill="#5C0A05"/>

  <text x="56" y="82" font-size="34" font-weight="700" fill="#FFFFFF">✦ Ambra</text>
  <text x="56" y="140" font-size="42" font-weight="900" fill="#FE4311">EVERY DENIAL TEACHES A RULE</text>

  <!-- 4 loop nodes -->
  <g font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    <rect x="90" y="300" width="250" height="120" rx="20" fill="#5C0A05"/>
    <text x="215" y="358" fill="#FE4311">1. INGEST</text>
    <text x="215" y="392" font-size="20" fill="#FFFFFF">resolved denials</text>

    <rect x="380" y="300" width="250" height="120" rx="20" fill="#FE4311"/>
    <text x="505" y="358">2. ANALYZE</text>
    <text x="505" y="392" font-size="20" fill="#FFFFFF">extract rules</text>

    <rect x="670" y="300" width="250" height="120" rx="20" fill="#5C0A05"/>
    <text x="795" y="358" fill="#FE4311">3. REMEMBER</text>
    <text x="795" y="392" font-size="20" fill="#FFFFFF">vector memory</text>

    <rect x="960" y="300" width="250" height="120" rx="20" fill="#FE4311"/>
    <text x="1085" y="358">4. PREVENT</text>
    <text x="1085" y="392" font-size="20" fill="#FFFFFF">score the claim</text>
  </g>

  <g stroke="#5C0A05" stroke-width="8" fill="none">
    <path d="M340 360 L375 360" marker-end="url(#x)"/>
  </g>
  <polygon points="375,352 393,360 375,368" fill="#5C0A05"/>
  <polygon points="665,352 683,360 665,368" fill="#5C0A05"/>
  <polygon points="955,352 973,360 955,368" fill="#5C0A05"/>

  <!-- loop back arrow -->
  <path d="M1085 430 L1085 500 L215 500 L215 432" fill="none" stroke="#FE4311" stroke-width="8" stroke-dasharray="16 10"/>
  <polygon points="207,432 215,414 223,432" fill="#FE4311"/>
  <text x="650" y="540" font-size="30" font-weight="800" fill="#5C0A05" text-anchor="middle">more denials resolved → more rules learned</text>

  <text x="60" y="630" font-size="60" font-weight="900" fill="#5C0A05">DENIAL → PREVENTION LOOP</text>
  <text x="62" y="675" font-size="30" font-weight="700" fill="#8a7f78">live demo · 28 cases · 5 payers</text>
</svg>
