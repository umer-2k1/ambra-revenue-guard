<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <rect width="1280" height="720" fill="#0E0706"/>
  <rect x="0" y="0" width="14" height="720" fill="#FE4311"/>

  <text x="60" y="80" font-size="34" font-weight="700" fill="#FFFFFF">✦ Ambra</text>
  <text x="60" y="140" font-size="40" font-weight="800" fill="#FE4311">THIS CLAIM LOOKED FINE.</text>
  <text x="60" y="196" font-size="40" font-weight="800" fill="#FFFFFF">THE SYSTEM SAID NO.</text>

  <!-- score dial -->
  <circle cx="330" cy="450" r="185" fill="none" stroke="#2b1714" stroke-width="34"/>
  <circle cx="330" cy="450" r="185" fill="none" stroke="#FE4311" stroke-width="34"
          stroke-dasharray="1040 120" stroke-linecap="round" transform="rotate(-90 330 450)"/>
  <text x="330" y="450" font-size="170" font-weight="900" fill="#FFFFFF" text-anchor="middle">90</text>
  <text x="330" y="515" font-size="40" font-weight="800" fill="#FE4311" text-anchor="middle">HIGH RISK</text>

  <!-- flags -->
  <g font-size="30" font-weight="700">
    <rect x="600" y="300" width="620" height="86" rx="16" fill="#1c0f0d"/>
    <rect x="600" y="300" width="10" height="86" rx="5" fill="#FE4311"/>
    <text x="634" y="352" fill="#FFFFFF">✕  No transport-necessity language</text>

    <rect x="600" y="404" width="620" height="86" rx="16" fill="#1c0f0d"/>
    <rect x="600" y="404" width="10" height="86" rx="5" fill="#FE4311"/>
    <text x="634" y="456" fill="#FFFFFF">✕  No itemized ALS procedures</text>

    <rect x="600" y="508" width="620" height="86" rx="16" fill="#1c0f0d"/>
    <rect x="600" y="508" width="10" height="86" rx="5" fill="#FF9E80"/>
    <text x="634" y="560" fill="#FFFFFF">✕  Destination / mileage not justified</text>
  </g>

  <text x="60" y="660" font-size="34" font-weight="800" fill="#FFFFFF">CAUGHT BEFORE SUBMISSION</text>
</svg>
