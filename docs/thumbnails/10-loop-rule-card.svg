<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#FE4311" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FE4311" stop-opacity="0"/>
    </radialGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#FE4311"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#1A0B09"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="10" fill="#FE4311"/>

  <text x="64" y="78" font-size="30" font-weight="800" fill="#FFFFFF">✦ Ambra</text>

  <text x="64" y="232" font-size="84" font-weight="900" fill="#FFFFFF">EVERY DENIAL</text>
  <text x="64" y="322" font-size="84" font-weight="900" fill="#FE4311">TEACHES</text>
  <text x="64" y="412" font-size="84" font-weight="900" fill="#FE4311">A RULE</text>

  <text x="64" y="500" font-size="28" fill="#F8F4F1">Resolved denials become rules</text>
  <text x="64" y="538" font-size="28" fill="#F8F4F1">that catch the next claim.</text>

  <rect x="720" y="130" width="300" height="52" rx="26" fill="#2A1512" stroke="#5A2A22" stroke-width="2"/>
  <text x="870" y="164" font-size="22" font-weight="800" fill="#c9b7b3" text-anchor="middle">DENIAL RESOLVED</text>
  <line x1="870" y1="188" x2="870" y2="248" stroke="#FE4311" stroke-width="5" marker-end="url(#a)"/>

  <rect x="720" y="262" width="496" height="330" rx="24" fill="#2A1512" stroke="#FE4311" stroke-width="3"/>
  <rect x="752" y="292" width="248" height="42" rx="21" fill="#FE4311"/>
  <text x="876" y="321" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">NEW RULE LEARNED</text>

  <text x="752" y="394" font-size="22" font-weight="800" fill="#FE4311">IF</text>
  <text x="752" y="434" font-size="30" font-weight="800" fill="#FFFFFF">Medical-necessity note</text>
  <text x="752" y="472" font-size="30" font-weight="800" fill="#FFFFFF">is missing</text>

  <text x="752" y="530" font-size="22" font-weight="800" fill="#FE4311">THEN</text>
  <text x="752" y="570" font-size="30" font-weight="800" fill="#FFFFFF">flag it before submit</text>

  <rect x="1034" y="292" width="150" height="42" rx="21" fill="#DC2626"/>
  <text x="1109" y="321" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">HIGH RISK</text>
