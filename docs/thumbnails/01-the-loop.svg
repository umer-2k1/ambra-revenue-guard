  <rect x="652" y="250" width="262" height="164" rx="18" fill="#2A1512" stroke="#43221C" stroke-width="2"/>
  <text x="680" y="300" font-size="24" font-weight="800" fill="#FE4311">03</text>
  <text x="680" y="356" font-size="30" font-weight="800" fill="#FFFFFF">REMEMBER</text>
