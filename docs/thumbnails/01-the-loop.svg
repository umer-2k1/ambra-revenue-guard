  <line x1="1176" y1="474" x2="120" y2="474" stroke="#FE4311" stroke-width="3" stroke-dasharray="12 9" marker-end="url(#a)"/>
  <text x="640" y="518" font-size="22" font-weight="600" fill="#FE4311" text-anchor="middle">more denials resolved → fewer future denials</text>

