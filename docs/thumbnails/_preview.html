<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#0b0b0b; font-family:'Helvetica Neue',Arial,sans-serif;
         display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px; }
  .wrap { position:relative; }
  img { width:100%; display:block; border-radius:10px; }
  .cap { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.62); color:#fff;
         font-size:17px; font-weight:700; padding:6px 12px; border-radius:8px; }
</style>
</head>
<body>
  <div class="wrap"><img src="01-the-loop.png"><div class="cap">01 · The loop</div></div>
  <div class="wrap"><img src="02-ambulance-loop.png"><div class="cap">02 · Ambulance + loop</div></div>
  <div class="wrap"><img src="03-ecg-heartbeat.png"><div class="cap">03 · ECG heartbeat</div></div>
  <div class="wrap"><img src="04-star-of-life.png"><div class="cap">04 · Star of Life</div></div>
  <div class="wrap"><img src="05-ambulance-hero.png"><div class="cap">05 · Ambulance hero</div></div>
</body>
</html>
