<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="64" y="70" font-size="28" font-weight="800" fill="#5C0A05">✦ Ambra</text>
  <text x="640" y="128" font-size="42" font-weight="800" fill="#5C0A05" text-anchor="middle">A DENIED CLAIM, CAUGHT IN TIME</text>

  <rect x="64" y="184" width="560" height="376" rx="20" fill="#FDECEC" stroke="#F3C3C3" stroke-width="2"/>
  <text x="344" y="404" font-size="104" font-weight="900" fill="#B02A2A" text-anchor="middle">DENIED</text>
  <text x="344" y="474" font-size="26" font-weight="600" fill="#8f4a4a" text-anchor="middle">what would have happened</text>

  <rect x="656" y="184" width="560" height="376" rx="20" fill="#EAF7EF" stroke="#B7E1C6" stroke-width="2"/>
  <text x="936" y="404" font-size="96" font-weight="900" fill="#1E7A45" text-anchor="middle">PREVENTED</text>
  <text x="936" y="474" font-size="26" font-weight="600" fill="#3f7a58" text-anchor="middle">caught before submission</text>

  <text x="64" y="622" font-size="28" font-weight="600" fill="#5C0A05">Ambra learns from your resolved denials and scores the next claim.</text>
</svg>
