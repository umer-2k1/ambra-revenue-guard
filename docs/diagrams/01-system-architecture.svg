<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a7f78"/>
    </marker>
  </defs>
  <rect width="980" height="660" fill="#FBF9F7"/>
  <text x="30" y="42" font-size="21" font-weight="700" fill="#5C0A05">Ambra - System Architecture</text>
  <text x="30" y="64" font-size="12" fill="#8a7f78">Frontend on Vercel, FastAPI backend on Vercel, managed Postgres + Qdrant Cloud, external LLM/embedding APIs</text>

  <!-- Client -->
  <rect x="30" y="95" width="920" height="86" rx="14" fill="#EEE7DE" stroke="#DBD0C2"/>
  <text x="52" y="122" font-size="12" font-weight="700" fill="#7a6a5a">CLIENT</text>
  <rect x="52" y="132" width="620" height="36" rx="10" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="72" y="155" font-size="13" fill="#3a2f2a">Browser - React app: Denials / Analyze / Knowledge Base / Score</text>
  <text x="700" y="155" font-size="12" fill="#8a7f78">served from the Vercel CDN</text>

  <!-- Frontend -->
  <rect x="30" y="196" width="920" height="86" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="52" y="223" font-size="12" font-weight="700" fill="#7a6a5a">FRONTEND (own Vercel project)</text>
  <text x="52" y="250" font-size="14" font-weight="600" fill="#5C0A05">React 19 + Vite + Tailwind v4 + shadcn/ui</text>
  <text x="52" y="270" font-size="12" fill="#8a7f78">Talks to the backend over HTTPS; consumes the analysis progress stream (SSE) via fetch + ReadableStream</text>

  <!-- Backend -->
  <rect x="30" y="297" width="920" height="150" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="52" y="324" font-size="12" font-weight="700" fill="#7a6a5a">BACKEND (own Vercel project) - FastAPI</text>
  <rect x="52" y="336" width="420" height="94" rx="12" fill="#F8F4F1" stroke="#DBD0C2"/>
  <text x="70" y="362" font-size="13" font-weight="700" fill="#5C0A05">Extraction agent (LangGraph)</text>
  <text x="70" y="382" font-size="12" fill="#3a2f2a">identify -&gt; process_cluster (per-cluster loop) -&gt; finalize</text>
  <text x="70" y="400" font-size="12" fill="#8a7f78">extracts one prevention rule per denial cluster</text>
  <text x="70" y="418" font-size="12" fill="#8a7f78">writes rules + embeddings, streams progress</text>

  <rect x="492" y="336" width="440" height="94" rx="12" fill="#F8F4F1" stroke="#DBD0C2"/>
  <text x="510" y="362" font-size="13" font-weight="700" fill="#5C0A05">Scoring agent</text>
  <text x="510" y="382" font-size="12" fill="#3a2f2a">soft retrieval (vector + payer/CPT) -&gt; LLM judge -&gt; guard</text>
  <text x="510" y="400" font-size="12" fill="#8a7f78">returns risk score, flags, dollar estimate, plain-English fix</text>
  <text x="510" y="418" font-size="12" fill="#8a7f78">deterministic normalisation so flags and risk never disagree</text>

  <!-- Data -->
  <rect x="30" y="462" width="450" height="80" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="52" y="489" font-size="12" font-weight="700" fill="#7a6a5a">STRUCTURED STORE</text>
  <text x="52" y="515" font-size="14" font-weight="600" fill="#5C0A05">PostgreSQL - Neon (serverless)</text>
  <text x="52" y="533" font-size="12" fill="#8a7f78">denial_cases - prevention_rules - claim_scores</text>

  <rect x="500" y="462" width="450" height="80" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="522" y="489" font-size="12" font-weight="700" fill="#7a6a5a">VECTOR STORE</text>
  <text x="522" y="515" font-size="14" font-weight="600" fill="#5C0A05">Qdrant Cloud</text>
  <text x="522" y="533" font-size="12" fill="#8a7f78">denial_narratives - rule_embeddings (768-dim, cosine)</text>

  <!-- AI -->
  <rect x="30" y="557" width="450" height="80" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="52" y="584" font-size="12" font-weight="700" fill="#7a6a5a">REASONING (LLM)</text>
  <text x="52" y="610" font-size="14" font-weight="600" fill="#5C0A05">DeepSeek (OpenAI-compatible) - or Groq</text>
  <text x="52" y="628" font-size="12" fill="#8a7f78">rule extraction + claim scoring</text>

  <rect x="500" y="557" width="450" height="80" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="522" y="584" font-size="12" font-weight="700" fill="#7a6a5a">EMBEDDINGS</text>
  <text x="522" y="610" font-size="14" font-weight="600" fill="#5C0A05">Google Gemini (768-dim) - or Groq</text>
  <text x="522" y="628" font-size="12" fill="#8a7f78">turns denials and rules into vectors</text>

  <!-- arrows -->
  <line x1="490" y1="225" x2="490" y2="296" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="265" font-size="11" fill="#8a7f78">HTTPS + SSE</text>
  <line x1="200" y1="447" x2="200" y2="461" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="447" x2="700" y2="461" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="542" x2="200" y2="556" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="542" x2="700" y2="556" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
