<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a7f78"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#FBF9F7"/>
  <text x="30" y="42" font-size="21" font-weight="700" fill="#5C0A05">Ambra - System Architecture</text>
  <text x="30" y="64" font-size="12" fill="#8a7f78">Frontend and backend deploy as separate Vercel projects; data and AI are managed services.</text>

  <!-- Frontend -->
  <rect x="30" y="90" width="920" height="88" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="52" y="116" font-size="12" font-weight="700" fill="#7a6a5a">FRONTEND - its own Vercel project</text>
  <text x="52" y="144" font-size="14" font-weight="600" fill="#5C0A05">React app in the browser: Denials / Analyze / Knowledge Base / Score</text>
  <text x="52" y="166" font-size="12" fill="#8a7f78">React 19 + Vite + Tailwind v4 + shadcn/ui - consumes the analysis stream over SSE</text>

  <!-- arrow -->
  <line x1="490" y1="178" x2="490" y2="214" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="506" y="200" font-size="11" fill="#8a7f78">HTTPS + SSE</text>

  <!-- Backend -->
  <rect x="30" y="216" width="920" height="150" rx="14" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="52" y="242" font-size="12" font-weight="700" fill="#7a6a5a">BACKEND - its own Vercel project - FastAPI</text>
  <rect x="52" y="256" width="420" height="94" rx="12" fill="#F8F4F1" stroke="#DBD0C2"/>
  <text x="70" y="282" font-size="13" font-weight="700" fill="#5C0A05">Extraction agent (LangGraph)</text>
  <text x="70" y="302" font-size="12" fill="#3a2f2a">identify -&gt; process_cluster (per-cluster loop) -&gt; finalize</text>
  <text x="70" y="320" font-size="12" fill="#8a7f78">extracts one prevention rule per denial cluster</text>
  <text x="70" y="338" font-size="12" fill="#8a7f78">writes rules + embeddings, streams progress</text>

  <rect x="492" y="256" width="440" height="94" rx="12" fill="#F8F4F1" stroke="#DBD0C2"/>
  <text x="510" y="282" font-size="13" font-weight="700" fill="#5C0A05">Scoring agent</text>
  <text x="510" y="302" font-size="12" fill="#3a2f2a">soft retrieval (vector + payer/CPT) -&gt; LLM judge -&gt; guard</text>
  <text x="510" y="320" font-size="12" fill="#8a7f78">returns risk, flags, dollar estimate, plain-English fix</text>
  <text x="510" y="338" font-size="12" fill="#8a7f78">deterministic normalisation so flags and risk agree</text>

  <!-- arrows to services -->
  <line x1="137" y1="366" x2="137" y2="402" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372" y1="366" x2="372" y2="402" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607" y1="366" x2="607" y2="402" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="842" y1="366" x2="842" y2="402" stroke="#8a7f78" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- services row -->
  <rect x="30" y="404" width="215" height="92" rx="12" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="48" y="432" font-size="12" font-weight="700" fill="#7a6a5a">STRUCTURED</text>
  <text x="48" y="458" font-size="13" font-weight="600" fill="#5C0A05">PostgreSQL (Neon)</text>
  <text x="48" y="480" font-size="11" fill="#8a7f78">rules / cases / scores</text>

  <rect x="265" y="404" width="215" height="92" rx="12" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="283" y="432" font-size="12" font-weight="700" fill="#7a6a5a">VECTOR</text>
  <text x="283" y="458" font-size="13" font-weight="600" fill="#5C0A05">Qdrant Cloud</text>
  <text x="283" y="480" font-size="11" fill="#8a7f78">denial + rule vectors</text>

  <rect x="500" y="404" width="215" height="92" rx="12" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="518" y="432" font-size="12" font-weight="700" fill="#7a6a5a">REASONING</text>
  <text x="518" y="458" font-size="13" font-weight="600" fill="#5C0A05">DeepSeek (or Groq)</text>
  <text x="518" y="480" font-size="11" fill="#8a7f78">extraction + scoring</text>

  <rect x="735" y="404" width="215" height="92" rx="12" fill="#FFFFFF" stroke="#DBD0C2"/>
  <text x="753" y="432" font-size="12" font-weight="700" fill="#7a6a5a">EMBEDDINGS</text>
  <text x="753" y="458" font-size="13" font-weight="600" fill="#5C0A05">Google Gemini (or Groq)</text>
  <text x="753" y="480" font-size="11" fill="#8a7f78">768-dim vectors</text>

  <text x="30" y="530" font-size="12" fill="#8a7f78">The LLM and embedding providers are a one-line switch in .env - the prompts and code are provider-agnostic.</text>
</svg>
