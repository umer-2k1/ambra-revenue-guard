<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C0A05"/>
    </marker>
    <marker id="a7o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FE4311"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#FBF9F7"/>
  <text x="30" y="42" font-size="21" font-weight="700" fill="#5C0A05">Sequence - POST /api/analyze (learning, streamed)</text>
  <text x="30" y="64" font-size="12" fill="#8a7f78">One request runs the whole extraction graph and streams progress back over SSE.</text>

  <!-- participants -->
  <rect x="30" y="86" width="130" height="34" rx="8" fill="#5C0A05"/><text x="95" y="108" font-size="12" fill="#fff" text-anchor="middle">User</text>
  <rect x="200" y="86" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="275" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">Frontend</text>
  <rect x="390" y="86" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="465" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">FastAPI</text>
  <rect x="580" y="86" width="160" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="660" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">LangGraph</text>
  <rect x="780" y="86" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="865" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">DeepSeek + Data</text>

  <!-- lifelines -->
  <line x1="95" y1="120" x2="95" y2="575" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="275" y1="120" x2="275" y2="575" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="465" y1="120" x2="465" y2="575" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="660" y1="120" x2="660" y2="575" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="865" y1="120" x2="865" y2="575" stroke="#DBD0C2" stroke-dasharray="5 5"/>

  <line x1="95" y1="150" x2="274" y2="150" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="100" y="144" font-size="11" fill="#3a2f2a">click "Analyze Denials"</text>

  <line x1="275" y1="184" x2="464" y2="184" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="280" y="178" font-size="11" fill="#3a2f2a">POST /api/analyze</text>

  <line x1="465" y1="218" x2="659" y2="218" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="470" y="212" font-size="11" fill="#3a2f2a">astream(stream_mode="custom")</text>

  <line x1="660" y1="252" x2="276" y2="252" stroke="#FE4311" stroke-width="1.6" marker-end="url(#a7o)"/>
  <text x="470" y="246" font-size="11" fill="#8a7f78" text-anchor="middle">SSE: starting / clustering (28 cases, 5 patterns)</text>

  <!-- loop -->
  <rect x="250" y="272" width="660" height="250" rx="12" fill="none" stroke="#FE4311" stroke-dasharray="6 5"/>
  <text x="264" y="292" font-size="11" font-weight="700" fill="#FE4311">loop - for each of 5 clusters</text>

  <line x1="660" y1="316" x2="864" y2="316" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="666" y="310" font-size="11" fill="#3a2f2a">extract rule (prompt with cluster cases)</text>

  <line x1="865" y1="346" x2="661" y2="346" stroke="#8a7f78" stroke-width="1.4" marker-end="url(#a7)"/>
  <text x="700" y="340" font-size="11" fill="#8a7f78">structured JSON rule (1 retry on failure)</text>

  <line x1="660" y1="380" x2="864" y2="380" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="666" y="374" font-size="11" fill="#3a2f2a">insert rule (Postgres) + embed (Gemini) + upsert (Qdrant)</text>

  <line x1="660" y1="414" x2="276" y2="414" stroke="#FE4311" stroke-width="1.6" marker-end="url(#a7o)"/>
  <text x="470" y="408" font-size="11" fill="#8a7f78" text-anchor="middle">SSE: "stored" + the full rule (renders an inline card)</text>

  <text x="264" y="446" font-size="11" fill="#8a7f78">one cluster at a time, so the live feed stays readable</text>
  <text x="264" y="464" font-size="11" fill="#8a7f78">unclustered / scattered denials are skipped on purpose</text>
  <text x="264" y="496" font-size="11" fill="#8a7f78">storage work runs off the event loop so status polling stays fast</text>

  <line x1="660" y1="536" x2="276" y2="536" stroke="#FE4311" stroke-width="1.6" marker-end="url(#a7o)"/>
  <text x="470" y="530" font-size="11" fill="#8a7f78" text-anchor="middle">SSE: complete (5 rules, 24 + 5 embeddings)</text>

  <line x1="275" y1="568" x2="96" y2="568" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a7)"/>
  <text x="110" y="562" font-size="11" fill="#3a2f2a">progress bar 100% -&gt; "View Knowledge Base"</text>
</svg>
