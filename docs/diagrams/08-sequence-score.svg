<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5C0A05"/>
    </marker>
    <marker id="a8o" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#FE4311"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#FBF9F7"/>
  <text x="30" y="42" font-size="21" font-weight="700" fill="#5C0A05">Sequence - POST /api/score (catching a claim)</text>
  <text x="30" y="64" font-size="12" fill="#8a7f78">How a new narrative is checked against memory: retrieve, judge, guard, return.</text>

  <rect x="30" y="86" width="130" height="34" rx="8" fill="#5C0A05"/><text x="95" y="108" font-size="12" fill="#fff" text-anchor="middle">User</text>
  <rect x="200" y="86" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="275" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">Frontend</text>
  <rect x="390" y="86" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="465" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">Scoring agent</text>
  <rect x="580" y="86" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="655" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">Gemini + Qdrant</text>
  <rect x="780" y="86" width="170" height="34" rx="8" fill="#FFFFFF" stroke="#DBD0C2"/><text x="865" y="108" font-size="12" fill="#5C0A05" text-anchor="middle">DeepSeek + Postgres</text>

  <line x1="95" y1="120" x2="95" y2="558" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="275" y1="120" x2="275" y2="558" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="465" y1="120" x2="465" y2="558" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="655" y1="120" x2="655" y2="558" stroke="#DBD0C2" stroke-dasharray="5 5"/>
  <line x1="865" y1="120" x2="865" y2="558" stroke="#DBD0C2" stroke-dasharray="5 5"/>

  <line x1="95" y1="150" x2="274" y2="150" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a8)"/>
  <text x="100" y="144" font-size="11" fill="#3a2f2a">click "Score Claim" (narrative, payer, CPT)</text>

  <line x1="275" y1="182" x2="464" y2="182" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a8)"/>
  <text x="280" y="176" font-size="11" fill="#3a2f2a">POST /api/score</text>

  <line x1="465" y1="214" x2="654" y2="214" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a8)"/>
  <text x="470" y="208" font-size="11" fill="#3a2f2a">embed the narrative (query) -&gt; Qdrant top-k rules</text>

  <line x1="655" y1="244" x2="466" y2="244" stroke="#8a7f78" stroke-width="1.4" marker-end="url(#a8)"/>
  <text x="560" y="238" font-size="11" fill="#8a7f78" text-anchor="middle">semantic candidates (5)</text>

  <text x="470" y="276" font-size="11" fill="#8a7f78" text-anchor="middle">soft retrieval = vector hits UNION exact payer / CPT matches</text>

  <line x1="465" y1="308" x2="864" y2="308" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a8)"/>
  <text x="470" y="302" font-size="11" fill="#3a2f2a">judge claim + matched rules (structured JSON: flags, risk, fixes)</text>

  <line x1="865" y1="338" x2="466" y2="338" stroke="#8a7f78" stroke-width="1.4" marker-end="url(#a8)"/>
  <text x="610" y="332" font-size="11" fill="#8a7f78" text-anchor="middle">draft result (1 retry on bad JSON)</text>

  <rect x="440" y="356" width="430" height="84" rx="10" fill="#FFFFFF" stroke="#FE4311" stroke-dasharray="6 5"/>
  <text x="456" y="378" font-size="11" font-weight="700" fill="#FE4311">deterministic guard (in the agent)</text>
  <text x="456" y="398" font-size="11" fill="#3a2f2a">risk level can never be lower than what the flags imply</text>
  <text x="456" y="414" font-size="11" fill="#3a2f2a">score floored for HIGH / MEDIUM - nothing fabricated</text>
  <text x="456" y="430" font-size="11" fill="#3a2f2a">each flag enriched with its rule's source count and average $</text>

  <line x1="465" y1="468" x2="864" y2="468" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a8)"/>
  <text x="470" y="462" font-size="11" fill="#3a2f2a">insert claim score (audit trail)</text>

  <line x1="465" y1="506" x2="276" y2="506" stroke="#FE4311" stroke-width="1.6" marker-end="url(#a8o)"/>
  <text x="470" y="500" font-size="11" fill="#8a7f78" text-anchor="middle">result: overall risk, score, flags, top rec, plain-English rec</text>

  <line x1="275" y1="544" x2="96" y2="544" stroke="#5C0A05" stroke-width="1.6" marker-end="url(#a8)"/>
  <text x="110" y="538" font-size="11" fill="#3a2f2a">render: HIGH 88/100 + flags + fixes</text>
</svg>
